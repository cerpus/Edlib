name: Content Author

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/contentauthor.yaml"
      - "sourcecode/apis/contentauthor/**"
  workflow_call:
    inputs:
      version:
        description: "A version to release"
        required: true
        type: string
      additional_tag:
        description: "An additional tag"
        required: false
        type: string
      enable_latest:
        description: "Whether to tag as latest"
        required: false
        type: boolean
        default: false
      deploy:
        description: "A version to release"
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: sourcecode/apis/contentauthor

concurrency:
  group: ca-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpstan:
    if: "!inputs.deploy"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate composer
        run: composer validate

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: sockets, zip
          coverage: pcov

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ca-composer-${{ hashFiles('sourcecode/apis/contentauthor/composer.lock') }}
          restore-keys: |
            ca-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

  test:
    if: "!inputs.deploy"
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate composer
        run: composer validate

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: sourcecode/apis/contentauthor
          cache-from: type=gha,scope=contentauthor
          cache-to: type=gha,scope=contentauthor,mode=max
          load: true
          tags: test-image
          target: test

      - name: Test
        run: |
          docker run -v "/tmp:/reports" --rm \
            test-image \
            vendor/bin/phpunit --coverage-clover /reports/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /tmp/coverage.xml
          context: sourcecode/apis/contentauthor

  build_publish:
    if: inputs.version && !inputs.deploy
    needs: [test, phpstan]
    runs-on: ubuntu-22.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: cerpusbot
          password: ${{ secrets.CERPUSBOT_SECRET }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Gather Docker metadata for PHP image
        id: php_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/cerpus/edlib-contentauthor
          tags: |
            type=raw,value=${{ inputs.version }},prefix=php-
            ${{ inputs.enable_latest && github.ref_name == 'master' && 'type=raw,value=latest,prefix=php-' || '' }}
            ${{ inputs.additional_tag && format('type=raw,value={0},prefix=php-', inputs.additional_tag) || '' }}

      - name: Build PHP image
        uses: docker/build-push-action@v5
        with:
          cache-from: type=gha,scope=contentauthor
          cache-to: type=gha,scope=contentauthor,mode=max
          context: sourcecode/apis/contentauthor
          push: true
          target: prod
          tags: ${{ steps.php_meta.outputs.tags }}

      - name: Gather Docker metadata for web image
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/cerpus/edlib-contentauthor
          tags: |
            type=raw,value=${{ inputs.version }},prefix=web-
            ${{ inputs.enable_latest && github.ref_name == 'master' && 'type=raw,value=latest,prefix=web-' || '' }}
            ${{ inputs.additional_tag && format('type=raw,value={0},prefix=web-', inputs.additional_tag) || '' }}

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          cache-from: type=gha,scope=contentauthor
          context: sourcecode/apis/contentauthor
          push: true
          target: web
          tags: ${{ steps.web_meta.outputs.tags }}
